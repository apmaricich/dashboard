layout:
  strategy: grid
  maxCols: 3
  theme: liturgical

widgets:
  - name: "System Metrics"
    type: system
    order: 1
    refresh: 5
  - name: "Liturgical Calendar"
    type: liturgical
    order: 2
    refresh: 60
  - name: "Time & Office"
    type: time
    order: 3
    refresh: 30
  - name: "MLX Status"
    type: mlx
    order: 4
    refresh: 30
    params:
      endpoint: "http://localhost:8080"
