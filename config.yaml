layout:
  strategy: grid
  maxCols: 3
  theme: liturgical
  # theme: seasonal
  # theme: vibrant
  header: "Veritas"
  footer: "Success is defined by your willingness to keep going."

widgets:
  - name: "Clock"
    type: clock
    order: 1
    refresh: 1
  - name: "Time & Office"
    type: time
    order: 2
    refresh: 30
  - name: "Liturgical Calendar"
    type: liturgical
    order: 3
    refresh: 60
  - name: "System Metrics"
    type: system
    order: 4
    refresh: 5
  - name: "MLX Status"
    type: mlx
    order: 5
    refresh: 30
    params:
      endpoint: "http://localhost:8080"
