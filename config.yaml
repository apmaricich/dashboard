layout:
  strategy: grid
  maxCols: 2
  theme: liturgical
  # theme: seasonal
  # theme: vibrant
  header: "Veritas"
  footer: "Success is defined by your willingness to keep going."

widgets:
  - name: "Clock"
    type: clock
    order: 1
    refresh: 1
  - name: "Office of the Hours"
    type: office
    order: 3
    refresh: 60
  - name: "Liturgical Calendar"
    type: liturgical
    order: 2
    refresh: 60
    params:
      showProgress: true
  - name: "System Metrics"
    type: system
    order: 4
    refresh: 5
  - name: "MLX Status"
    type: mlx
    order: 5
    refresh: 30
    params:
      endpoint: "http://localhost:8080"
  - name: "Weather (Bowie, MD)"
    type: weather
    order: 6
    refresh: 600
    params:
      latitude: 38.9443
      longitude: -76.831
      temperatureUnit: fahrenheit
  - name: "Work Progress"
    type: workday
    order: 7
    refresh: 60
    params:
      startHour: 8
      endHour: 16
