layout:
  strategy: grid
  maxCols: 3
  # strategy: focus
  theme: liturgical
  # theme: seasonal
  # theme: vibrant
  themeRefresh:
    atHour: 23
    # intervalHours: 3
  header: "Veritas"
  footer: "Success is defined by your willingness to keep going."

widgets:
  - name: "Clock"
    type: clock
    order: 1
    refresh: 1
    center: true
  - name: "Office of the Hours"
    type: office
    order: 3
    refresh: 60
  - name: "Liturgical Calendar"
    type: liturgical
    order: 2
    refresh: 60
    params:
      showProgress: true
  - name: "System Metrics"
    type: system
    order: 6
    refresh: 5
    center: true
  - name: "MLX Status"
    type: mlx
    order: 7
    refresh: 30
    center: true
    params:
      endpoint: "http://localhost:8080"
  - name: "Weather (Bowie, MD)"
    type: weather
    order: 5
    refresh: 600
    center: true
    params:
      latitude: 38.9443
      longitude: -76.831
      temperatureUnit: fahrenheit
  - name: "Work Progress"
    type: workday
    order: 4
    refresh: 60
    center: true
    params:
      startHour: 8
      endHour: 16
  - name: "Task"
    type: tasklist
    order: 8
    refresh: 60
    params:
      file: "~/Code/task/tasks.json"
