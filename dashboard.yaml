layout:
  # strategy: grid
  # maxCols: 3
  # maxRows: 2
  # strategy: focus
  strategy: banner
  theme: liturgical
  # theme: seasonal
  # theme: vibrant
  themeRefresh:
    atHour: 23
    # intervalHours: 3
  header: "${date} | Veritas | ${time}"
  footer: "${music} | Success is defined by your willingness to keep going."
  vars:
    date:
      command: "echo S$(date +%y)•$(date +%m)•$(date +%d)"
      refresh: 43200 # 12 hours
    music:
      command: "printf '%s\\n' 'tell application \"Music\"' 'if player state is playing then' 'return \"♪ \" & name of current track & \" — \" & artist of current track' 'else' 'return \"No music playing\"' 'end if' 'end tell' | osascript"
      refresh: 30
    time:
      command: "date +%H:%M"
      refresh: 1

widgets:
  - name: "Clock"
    type: clock
    order: 1
    refresh: 1
    center: true

  - name: "Liturgical Calendar"
    type: liturgical
    order: 6
    refresh: 60
    params:
      showProgress: true
      showKey: false

  - name: "Weather (Bowie, MD)"
    type: weather
    order: 3
    refresh: 600
    center: true
    daysShown: [] # hidden
    params:
      latitude: 38.9443
      longitude: -76.831
      temperatureUnit: fahrenheit

  - name: "Work Progress"
    type: workday
    order: 3
    refresh: 60
    center: true
    daysHidden: ["weekends"]
    params:
      startHour: 8
      endHour: 16

  - name: "Pomo Today"
    type: shell
    order: 2
    refresh: 600
    center: true
    params:
      command: "pomo stats"

  - name: "Pomo Week"
    type: shell
    order: 4
    refresh: 600
    center: true
    params:
      command: "pomo stats --week"

  - name: "System Metrics"
    type: system
    order: 6
    refresh: 5
    center: true
    daysShown: [] # hidden

  - name: "MLX Status"
    type: mlx
    order: 5
    refresh: 30
    center: true
    params:
      endpoint: "http://localhost:8080"

  - name: "OP"
    type: image
    order: 1
    refresh: 0
    center: true
    daysShown: [] # hidden
    params:
      path: ./assets/op.png
      preserveAspectRatio: true

