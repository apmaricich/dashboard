layout:
  strategy: grid
  maxCols: 2
  maxRows: 2
  # strategy: focus
  # strategy: banner
  # theme: liturgical
  theme: seasonal
  # theme: vibrant
  themeRefresh:
    atHour: 23
    # intervalHours: 3
  header: "${date} | Veritas | ${time}"
  footer: "${music} | Success is defined by your willingness to keep going."
  vars:
    date:
      command: "echo S$(date +%y)•$(date +%m)•$(date +%d)"
      refresh: 43200 # 12 hours
    music:
      command: "printf '%s\\n' 'tell application \"Music\"' 'if player state is playing then' 'return \"♪ \" & name of current track & \" — \" & artist of current track' 'else' 'return \"No music playing\"' 'end if' 'end tell' | osascript"
      refresh: 30
    time:
      command: "date +%H:%M"
      refresh: 1

widgets:
  - name: "Tasks"
    type: shell
    order: 10
    refresh: 60
    params:
      command: "task"

  - name: "Stats"
    type: shell
    order: 11
    refresh: 60
    params:
      command: "task stats"

  - name: "MLX Status"
    type: mlx
    order: 100
    refresh: 30
    center: true
    params:
      endpoint: "http://localhost:8080"

